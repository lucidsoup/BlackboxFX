name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build
          else
            cmake -S . -B build -DCMAKE_C_FLAGS=-Werror
          fi
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render demo presets
        shell: bash
        run: |
          mkdir demo
          bin=build/bfx; [ -f build/Release/bfx.exe ] && bin=build/Release/bfx.exe
          "$bin" --demo --render-all demo
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: demo-renders
          path: demo/

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - run: cmake --build build
      - run: ./build/test_engine
      - run: python3 -m py_compile tools/probe/blackbox_probe.py
